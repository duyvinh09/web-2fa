<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://i.imgur.com/Y4HF5li.jpg" />
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
    <title>2FA Generator | One-Time Password Utility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8 space-y-8 bg-slate-800 rounded-xl shadow-2xl">
        <div class="text-center">
            <div class="flex justify-center mb-4">
                <i class="fas fa-shield-alt text-4xl text-purple-400"></i>
            </div>
            <h1 class="text-3xl font-bold text-white">2FA Generator</h1>
            <p class="mt-2 text-sm text-slate-300">One-Time Password Utility</p>
        </div>
        <div class="space-y-6">
            <div>
                <label for="secret-key" class="block text-sm font-medium text-slate-300 mb-1">2FA Secret</label>
                <div class="flex rounded-md shadow-sm">
                    <input id="secret-key" type="text" class="flex-1 min-w-0 block w-full px-3 py-3 rounded-l-md border border-slate-600 bg-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent sm:text-sm" placeholder="Enter your secret key">
                    <span class="inline-flex items-center px-3 rounded-r-md border border-l-0 border-slate-600 bg-slate-700 text-slate-400 text-sm">
                        <i class="fas fa-key"></i>
                    </span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <label class="block text-sm font-medium text-slate-300 mb-1">Enable OTP</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-otp">
                    <span class="slider"></span>
                </label>
            </div>
            <div id="otp-container" class="hidden">
                <label for="otp-code" class="block text-sm font-medium text-slate-300 mb-1">2FA Code</label>
                <div class="flex rounded-md shadow-sm">
                    <input id="otp-code" type="text" readonly="" class="flex-1 min-w-0 block w-full px-3 py-3 rounded-l-md border border-slate-600 bg-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent sm:text-sm otp-input" placeholder="OTP will appear here">
                    <button id="copy-otp" class="inline-flex items-center px-4 rounded-r-md border border-l-0 border-slate-600 bg-slate-700 text-slate-300 hover:bg-purple-600 transition-colors duration-200">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
                <p class="mt-2 text-xs text-slate-400">
                    <i class="fas fa-info-circle mr-1"></i> This code refreshes every 30 seconds
                </p>
                <button type="button" class="w-full py-3 px-4 bg-purple-600 hover:bg-purple-700 text-white font-medium rounded-md transition-colors duration-200 flex items-center justify-center space-x-2 mt-2" onclick="reset2FACode()">
                    <i class="fas fa-sync-alt"></i>
                    <span>Get New 2FA Code</span>
                </button>
            </div>
        </div>
        <div class="flex items-center justify-center pt-4">
            <div class="text-sm text-slate-400">
                <i class="fas fa-clock mr-1"></i> <span id="timer">30</span>s remaining
            </div>
        </div>
    </div>
    <script src="/assets/script.js"></script>
</body>
</html>
